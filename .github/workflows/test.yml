name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/test.yml'
      - '.github/workflows/release.yml'
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/test.yml'
      - '.github/workflows/release.yml'
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ariatype/desktop build
      - run: pnpm --filter @ariatype/shared typecheck
      - run: pnpm check:i18n

  test-macos:
    name: Rust tests and coverage (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        working-directory: apps/desktop/src-tauri
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info -- --test-threads=1

      - name: Display coverage summary
        working-directory: apps/desktop/src-tauri
        run: cargo llvm-cov report --summary-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-macos
          path: apps/desktop/src-tauri/lcov.info
          retention-days: 7

      - name: Run clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-features -- -D warnings

      - name: Check formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check
