name: Release Native macOS App

# Builds, signs, notarizes and publishes VoiceFlow (native Swift version) to
# the GitHub release, then updates the feed the app queries to offer the
# update.
#
# Required secrets — the same as "Release Desktop App":
#   APPLE_CERTIFICATE          — .p12 Developer ID Application, base64-encoded
#   APPLE_CERTIFICATE_PASSWORD — .p12 export password
#   APPLE_SIGNING_IDENTITY     — "Developer ID Application: Name (TEAMID)"
#   APPLE_API_ISSUER           — App Store Connect issuer ID
#   APPLE_API_KEY              — App Store Connect key ID
#   APPLE_API_KEY_P8           — contents of the .p8 file

on:
  # Pushing a tag is enough: the release is created if it doesn't exist.
  push:
    tags:
      - 'native-v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to feed (e.g. native-v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-native-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # The app requires the macOS 26 SDK (SpeechAnalyzer, Foundation Models,
    # NSGlassEffectView). On an older runner, the build fails.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done

      - name: Check macOS SDK
        run: |
          SDK=$(xcrun --show-sdk-version --sdk macosx)
          echo "macOS SDK: $SDK · Xcode: $(xcodebuild -version | head -1)"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::macOS SDK $SDK too old — 26 or later is required."
            exit 1
          fi

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: voiceflow-native/VoiceFlow/.build
          key: spm-${{ runner.os }}-${{ hashFiles('voiceflow-native/VoiceFlow/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Set version from tag
        run: |
          VERSION="${TAG##*v}"
          PLIST=voiceflow-native/VoiceFlow/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate the icon
        run: |
          cd voiceflow-native
          swift tools/make-icon.swift /tmp/VoiceFlow.iconset
          iconutil -c icns /tmp/VoiceFlow.iconset -o VoiceFlow/AppIcon.icns

      - name: Build and sign
        env:
          DEV_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          cd voiceflow-native
          ./build.sh release
          codesign --verify --strict --verbose=2 dist/VoiceFlow.app

      - name: Build the DMG
        run: |
          cd voiceflow-native
          DMG="dist/VoiceFlow-$VERSION.dmg"
          hdiutil create -volname "VoiceFlow" -srcfolder dist/VoiceFlow.app \
            -ov -format UDZO "$DMG"
          codesign --force --sign "$DEV_ID" "$DMG"
          echo "DMG=voiceflow-native/$DMG" >> "$GITHUB_ENV"
        env:
          DEV_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Notarize and staple
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          # Fetch the log on rejection: without it, "Invalid" says
          # nothing about the cause.
          SUBMISSION=$(xcrun notarytool submit "$DMG" \
            --key "$KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m --output-format json | tee /dev/stderr | jq -r .id)
          STATUS=$(xcrun notarytool info "$SUBMISSION" \
            --key "$KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --output-format json | jq -r .status)
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization rejected ($STATUS) — log:"
            xcrun notarytool log "$SUBMISSION" \
              --key "$KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          rm -f "$KEY_PATH"

      - name: Write the update feed
        run: |
          # The app queries this file; the "latest" URL stays stable from
          # one release to the next.
          NOTES=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || echo "Native macOS version $VERSION.")
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/VoiceFlow-$VERSION.dmg" \
            '{version: $version, notes: $notes, url: $url}' > appcast.json
          cat appcast.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if the tag was pushed without going through the UI.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "VoiceFlow native ${VERSION}" \
              --notes "Native macOS version ${VERSION}." --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$DMG" appcast.json --clobber

      - name: Verify the published product's signature
        run: |
          spctl --assess --type open --context context:primary-signature -v "$DMG"
