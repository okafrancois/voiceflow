name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

env:
  LLAMA_CPP_RELEASE_TAG: b9568

# Builds a signed and notarized universal macOS application and publishes it
# to the GitHub release for this repository.
#
# Required secrets:
#   APPLE_CERTIFICATE         — base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD — password used when exporting the .p12
#   APPLE_SIGNING_IDENTITY    — e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_API_ISSUER          — App Store Connect API issuer ID
#   APPLE_API_KEY             — App Store Connect API key ID
#   APPLE_API_KEY_P8          — contents of the App Store Connect API .p8 file
#   TAURI_SIGNING_PRIVATE_KEY — Tauri updater private signing key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — Optional password for the Tauri updater private key
#   TAURI_UPDATER_PUBKEY      — Public key embedded in the app for update signature checks

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - name: Check required release secrets
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_P8 \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_UPDATER_PUBKEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release secret: $name"
              exit 1
            fi
          done

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          jq ".version = \"$VERSION\"" apps/desktop/src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json apps/desktop/src-tauri/tauri.conf.json

      - name: Prepare llama.cpp local polish runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/llama-server-assets
          gh release download "$LLAMA_CPP_RELEASE_TAG" \
            --repo ggml-org/llama.cpp \
            --pattern '*macos*arm64*' \
            --pattern '*macos*x64*' \
            --dir .tmp/llama-server-assets
          node scripts/prepare-llama-server-release-assets.mjs \
            --platform macos \
            --assets-dir .tmp/llama-server-assets

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k $KEYCHAIN_PATH -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s $KEYCHAIN_PATH
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build universal macOS DMG
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          ARIATYPE_REQUIRE_LOCAL_POLISH_RUNTIME: "1"
        run: pnpm tauri:build:mac-universal

      - name: Verify bundled local polish runtimes
        run: node scripts/verify-tauri-runtime-resources.mjs --platform macos --smoke --smoke-timeout-ms 30000

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 1

  # ── Publish ────────────────────────────────────────────────────────────────
  publish:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: dist/

      - name: Flatten macOS release assets
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist -- {} +
          find dist -mindepth 1 -type d -empty -delete

      - name: Generate GitHub release manifests
        run: |
          git log -1 --pretty=%B > /tmp/voice-flow-release-notes.md
          node scripts/generate-release-manifests.mjs \
            --release-dir dist \
            --version "${{ env.VERSION }}" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}" \
            --notes-file /tmp/voice-flow-release-notes.md \
            --require-updater \
            --require-updater-platform darwin-aarch64 \
            --require-updater-platform darwin-x86_64

      - name: Create release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v${{ env.VERSION }} dist/* \
            --repo ${{ github.repository }} \
            --title "Voice Flow v${{ env.VERSION }}" \
            --notes-file /tmp/voice-flow-release-notes.md
