# Wrangler configuration for Cloudflare Pages
# Deploy from monorepo root: wrangler pages deploy packages/website/out --project-name voice-flow
# Or from packages/website/: wrangler pages deploy out --project-name voice-flow
name = "voice-flow"
pages_build_output_dir = "out"
compatibility_date = "2026-09-23"

[env.production]
name = "voice-flow"

[env.preview]
name = "voice-flow-preview"
